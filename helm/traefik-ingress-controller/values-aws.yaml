# EKS-specific Service configuration for AWS-managed TLS.
#
# TLS is terminated by the AWS Network Load Balancer using an ACM certificate.
# Set the certificate ARN per environment:
#
#   --set-string 'traefik.service.annotations.service\.beta\.kubernetes\.io/aws-load-balancer-ssl-cert=arn:aws:acm:REGION:ACCOUNT_ID:certificate/CERT_ID'
#
# In this mode, keep application Ingress objects without spec.tls. Browsers use
# HTTPS, but Traefik receives decrypted HTTP on the web entryPoint.
#
# Set global.internalLoadBalancer.enabled=true to create an internal NLB.

tlsStore:
  enabled: false

# TLS is terminated at the NLB, so Traefik receives plain HTTP on the web
# entryPoint. Serve the catch-all error page there without Traefik-side TLS.
errorPage:
  entryPoints:
    - web
  tls:
    enabled: false

traefik:
  service:
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-scheme: '{{ ternary "internal" "internet-facing" .Values.global.internalLoadBalancer.enabled }}'
      service.beta.kubernetes.io/aws-load-balancer-ssl-cert: ""
      service.beta.kubernetes.io/aws-load-balancer-ssl-negotiation-policy: "ELBSecurityPolicy-TLS-1-2-Ext-2018-06"
      service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
      service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
      service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"

  ports:
    web:
      asDefault: true
      exposedPort: 80
      expose:
        default: true

    websecure:
      exposedPort: 443
      targetPort: web
      expose:
        default: true

  additionalArguments: []
